<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>File Control — отчёт __REPORT_DATE__</title><style>body{font:14px Segoe UI,Arial;margin:30px;color:#17212b}h1{color:#123a63}.filters{display:flex;gap:10px;margin:20px 0}.filters input{padding:9px;border:1px solid #aaa;border-radius:5px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}th{background:#123a63;color:#fff}tr[hidden]{display:none}.Удаление{color:#b42318}.Изменение{color:#1769aa}</style></head><body><h1>Отчёт File Control</h1><p>Дата: <b>__REPORT_DATE__</b> · <span id="count"></span></p><div class="filters"><input id="doc" placeholder="Поиск по документу"><input id="usr" placeholder="Поиск по пользователю"><input id="date" type="date"></div><table><thead><tr><th>Дата и время</th><th>Пользователь</th><th>Действие</th><th>Документ</th><th>Путь</th></tr></thead><tbody id="body"></tbody></table><script>const data=__EVENT_DATA__;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){let d=document.querySelector('#doc').value.toLowerCase(),u=document.querySelector('#usr').value.toLowerCase(),dt=document.querySelector('#date').value;let a=data.filter(x=>(!d||(x.documentName+' '+x.path).toLowerCase().includes(d))&&(!u||(x.domain+'\\'+x.user).toLowerCase().includes(u))&&(!dt||x.timestamp.slice(0,10)==dt));document.querySelector('#count').textContent='операций: '+a.length;document.querySelector('#body').innerHTML=a.map(x=>`<tr><td>${new Date(x.timestamp).toLocaleString('ru-RU')}</td><td>${esc(x.domain)}\\${esc(x.user)}</td><td class="${esc(x.action)}">${esc(x.action)}</td><td>${esc(x.documentName)}</td><td>${esc(x.path)}</td></tr>`).join('')}document.querySelectorAll('input').forEach(x=>x.oninput=draw);draw()</script></body></html>
