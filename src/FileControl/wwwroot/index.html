<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>File Control</title><style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#182230;background:#eef2f6}*{box-sizing:border-box}body{margin:0}header{background:#123a63;color:white;padding:18px 4vw;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:25px}.head{display:flex;gap:10px;align-items:center}.status{font-size:13px;background:#1f7a4d;padding:7px 11px;border-radius:16px}.wrap{max-width:1400px;margin:24px auto;padding:0 22px}.panel,.dialog{background:white;border-radius:12px;box-shadow:0 2px 14px #22334418;padding:18px;margin-bottom:18px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:12px;align-items:end}label{font-size:12px;color:#52606d;display:block;margin-bottom:5px}input,textarea,button{width:100%;padding:10px;border:1px solid #cbd5df;border-radius:6px;font:inherit}button{width:auto;border:0;background:#1769aa;color:white;cursor:pointer;font-weight:600}.secondary{background:#4f6070}.headerbtn{background:#ffffff22;border:1px solid #ffffff66}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;background:#f4f7fa;color:#52606d;position:sticky;top:0}th,td{padding:10px;border-bottom:1px solid #e3e8ed}tr:hover{background:#f7fbff}.action{font-weight:600}.Удаление{color:#b42318}.Изменение{color:#1769aa}.Создание{color:#137044}.count,.hint{color:#52606d}.tablebox{overflow:auto;max-height:65vh}.empty{text-align:center;padding:35px;color:#687787}.overlay{display:none;position:fixed;inset:0;background:#10203099;z-index:10;padding:5vh 15px;overflow:auto}.overlay.open{display:block}.dialog{max-width:650px;margin:auto}.dialog h2{margin-top:0}.drive{display:flex;align-items:center;gap:10px;border:1px solid #dde4eb;padding:10px;border-radius:7px;margin:6px 0}.drive input{width:auto}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.buttons{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.message{margin-top:12px;padding:10px;border-radius:6px;background:#edf6ff;display:none}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.path{max-width:280px;overflow:hidden;text-overflow:ellipsis}.status{display:none}}
</style></head><body><header><h1>File Control</h1><div class="head"><span class="status" id="status">● служба работает</span><button class="headerbtn" onclick="openSettings()">⚙ Настройки мониторинга</button></div></header><main class="wrap"><section class="panel" id="diagnostic" style="display:none;border-left:5px solid #d97706"></section><section class="panel"><div class="filters"><div><label>Документ или путь</label><input id="document" placeholder="например, Отчёт.xlsx"></div><div><label>Пользователь</label><input id="user" placeholder="DOMAIN\\login"></div><div><label>Дата с</label><input id="from" type="date"></div><div><label>Дата по</label><input id="to" type="date"></div><button onclick="load()">Найти</button></div></section><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b>Журнал операций</b><span class="count" id="count"></span></div><div class="tablebox"><table><thead><tr><th>Дата и время</th><th>Пользователь</th><th>Действие</th><th>Документ</th><th>Полный путь</th><th>Процесс</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<div class="overlay" id="settings"><div class="dialog"><h2>Настройки мониторинга</h2><p class="hint">Выберите локальные диски либо укажите отдельные папки. Для регистрации логина пользователя программа настроит аудит Windows.</p><b>Доступные диски</b><div id="drives"></div><label style="margin-top:14px">Дополнительные папки (по одной в строке)</label><textarea id="paths" rows="5" placeholder="D:\Общие документы"></textarea><div class="grid2" style="margin-top:12px"><div><label>Час ежедневного отчёта</label><input id="reportHour" type="number" min="0" max="23"></div><div><label>Хранить журнал, дней</label><input id="retention" type="number" min="1" max="3650"></div></div><div id="message" class="message"></div><div class="buttons"><button class="secondary" onclick="closeSettings()">Закрыть</button><button onclick="saveSettings()">Сохранить и включить аудит</button></div></div></div>
<script>
const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let settingsData;
const today=new Date(),prev=new Date(Date.now()-86400000);el('to').value=today.toISOString().slice(0,10);el('from').value=prev.toISOString().slice(0,10);
async function load(){const p=new URLSearchParams({from:el('from').value+'T00:00:00',to:el('to').value+'T23:59:59',user:el('user').value,document:el('document').value});try{const data=await fetch('/api/events?'+p).then(r=>r.json());el('count').textContent='Найдено: '+data.length;el('rows').innerHTML=data.length?data.map(x=>`<tr><td>${new Date(x.timestamp).toLocaleString('ru-RU')}</td><td>${esc(x.domain)}\\${esc(x.user)}</td><td class="action ${esc(x.action)}">${esc(x.action)}</td><td title="${esc(x.details)}">${esc(x.documentName)}</td><td class="path" title="${esc(x.path)}">${esc(x.path)}</td><td>${esc(x.process)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">События не найдены</td></tr>'}catch(e){el('status').textContent='● ошибка связи';el('status').style.background='#b42318'}}
async function openSettings(){settingsData=await fetch('/api/settings').then(r=>r.json());const selected=settingsData.monitoredPaths.map(x=>x.toLowerCase());el('drives').innerHTML=settingsData.drives.map((d,i)=>`<label class="drive"><input type="checkbox" data-path="${esc(d.path)}" ${selected.includes(d.path.toLowerCase())?'checked':''}><b>${esc(d.label)}</b><span class="hint">${esc(d.type)}</span></label>`).join('');const roots=settingsData.drives.map(x=>x.path.toLowerCase());el('paths').value=settingsData.monitoredPaths.filter(x=>!roots.includes(x.toLowerCase())).join('\n');el('reportHour').value=settingsData.reportHour;el('retention').value=settingsData.retentionDays;el('message').style.display='none';el('settings').classList.add('open')}
function closeSettings(){el('settings').classList.remove('open')}
async function saveSettings(){const paths=[...document.querySelectorAll('#drives input:checked')].map(x=>x.dataset.path).concat(el('paths').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean));const r=await fetch('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({monitoredPaths:paths,reportHour:+el('reportHour').value,retentionDays:+el('retention').value})});const out=await r.json();el('message').textContent=out.message;el('message').style.display='block';el('message').style.background=r.ok?'#e8f7ee':'#fdecec'}
async function diagnostics(){try{const d=await fetch('/api/diagnostics').then(r=>r.json()),box=el('diagnostic');if(!d.subscriptionActive){box.style.display='block';box.innerHTML=`<b>Мониторинг Windows не запущен</b><p>${esc(d.lastError||'Нет доступа к журналу Security. Запустите приложение от администратора.')}</p>`;el('status').textContent='● мониторинг не работает';el('status').style.background='#b42318'}else if(d.received===0){box.style.display='block';box.innerHTML='<b>События аудита Windows не поступают</b><p>Откройте «Настройки мониторинга», выберите диски/папки и нажмите «Сохранить и включить аудит». Программу необходимо запустить от имени администратора.</p>'}else if(d.accepted===0){box.style.display='block';box.innerHTML=`<b>Получено событий Security: ${d.received}, но ни одно не относится к выбранным путям</b><p>Проверьте список каталогов в настройках мониторинга.</p>`}else box.style.display='none'}catch{}}
for(const id of ['document','user'])el(id).addEventListener('keydown',e=>{if(e.key==='Enter')load()});load();diagnostics();setInterval(diagnostics,10000);
</script></body></html>
