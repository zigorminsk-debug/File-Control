<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>File Control</title><style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#182230;background:#eef2f6}body{margin:0}header{background:#123a63;color:white;padding:22px 4vw;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:25px}.status{font-size:13px;background:#1f7a4d;padding:7px 11px;border-radius:16px}.wrap{max-width:1400px;margin:24px auto;padding:0 22px}.panel{background:white;border-radius:12px;box-shadow:0 2px 14px #22334418;padding:18px;margin-bottom:18px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:12px;align-items:end}label{font-size:12px;color:#52606d;display:block;margin-bottom:5px}input,button{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd5df;border-radius:6px;font:inherit}button{width:auto;border:0;background:#1769aa;color:white;cursor:pointer;font-weight:600}button.secondary{background:#4f6070}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;background:#f4f7fa;color:#52606d;position:sticky;top:0}th,td{padding:10px;border-bottom:1px solid #e3e8ed}tr:hover{background:#f7fbff}.action{font-weight:600}.Удаление{color:#b42318}.Изменение{color:#1769aa}.Создание{color:#137044}.count{color:#52606d}.tablebox{overflow:auto;max-height:65vh}.empty{text-align:center;padding:35px;color:#687787}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.path{max-width:280px;overflow:hidden;text-overflow:ellipsis}}
</style></head><body><header><h1>File Control</h1><span class="status" id="status">● служба работает</span></header><main class="wrap"><section class="panel"><div class="filters"><div><label>Документ или путь</label><input id="document" placeholder="например, Отчёт.xlsx"></div><div><label>Пользователь</label><input id="user" placeholder="DOMAIN\\login"></div><div><label>Дата с</label><input id="from" type="date"></div><div><label>Дата по</label><input id="to" type="date"></div><button onclick="load()">Найти</button></div></section><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b>Журнал операций</b><span class="count" id="count"></span></div><div class="tablebox"><table><thead><tr><th>Дата и время</th><th>Пользователь</th><th>Действие</th><th>Документ</th><th>Полный путь</th><th>Процесс</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const el=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=new Date(), prev=new Date(Date.now()-86400000); el('to').value=today.toISOString().slice(0,10); el('from').value=prev.toISOString().slice(0,10);
async function load(){const p=new URLSearchParams({from:el('from').value+'T00:00:00',to:el('to').value+'T23:59:59',user:el('user').value,document:el('document').value});try{const data=await fetch('/api/events?'+p).then(r=>r.json());el('count').textContent='Найдено: '+data.length;el('rows').innerHTML=data.length?data.map(x=>`<tr><td>${new Date(x.timestamp).toLocaleString('ru-RU')}</td><td>${esc(x.domain)}\\${esc(x.user)}</td><td class="action ${esc(x.action)}">${esc(x.action)}</td><td title="${esc(x.details)}">${esc(x.documentName)}</td><td class="path" title="${esc(x.path)}">${esc(x.path)}</td><td>${esc(x.process)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">События не найдены</td></tr>'}catch(e){el('status').textContent='● ошибка связи';el('status').style.background='#b42318'}}
for(const id of ['document','user'])el(id).addEventListener('keydown',e=>{if(e.key==='Enter')load()});load();
</script></body></html>
