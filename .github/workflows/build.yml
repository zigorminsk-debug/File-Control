name: Windows build
on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/FileControl/FileControl.csproj
      - name: Publish self-contained Windows application
        run: dotnet publish src/FileControl/FileControl.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Add installation tools
        shell: pwsh
        run: |
          Copy-Item scripts publish/scripts -Recurse
          Copy-Item README.md publish/README.md
          Compress-Archive publish/* FileControl-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FileControl-win-x64
          path: FileControl-win-x64.zip
          if-no-files-found: error
