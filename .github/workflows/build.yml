name: Windows build
on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/FileControl/FileControl.csproj
      - name: Publish self-contained Windows application
        run: dotnet publish src/FileControl/FileControl.csproj -c Release -r win-x64 --self-contained true -p:Version=1.0.${{ github.run_number }} -p:FileVersion=1.0.${{ github.run_number }}.0 -p:InformationalVersion=1.0.${{ github.run_number }}+${{ github.sha }} -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Add installation tools
        shell: pwsh
        run: |
          Copy-Item scripts publish/scripts -Recurse
          Copy-Item README.md publish/README.md
      # upload-artifact already creates the single downloadable ZIP archive.
      # Upload the folder directly to avoid a ZIP file nested inside another ZIP.
      - uses: actions/upload-artifact@v4
        with:
          name: FileControl-win-x64-build-${{ github.run_number }}
          path: publish/
          if-no-files-found: error
